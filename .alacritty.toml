[general]
import = ["~/dotfiles-linux/alacritty/alacritty.toml", "~/dotfiles-windows/alacritty/alacritty.toml"]
live_config_reload = true

[scrolling]
history = 100000

[colors.primary]
background = '#000000'

[[keyboard.bindings]]
action = "ReceiveChar"
key = "Return"
mods = "Alt"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"

[[keyboard.bindings]]
chars = "\b"
key = "Back"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[32;5u"
key = "Space"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[21;2~"
key = "Tab"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[22;2~"
key = "Tab"
mods = "Control|Shift"

[[keyboard.bindings]]
key = "Enter"
mods = "Alt"
chars = "\u000a"
